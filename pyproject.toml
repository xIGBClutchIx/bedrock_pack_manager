[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bedrock-pack-manager"
version = "0.1.0"
description = "Minecraft Bedrock pack manager for worlds, behavior packs, and resource packs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "nbtlib>=2.0.4",
]

[project.optional-dependencies]
lint = [
  "ruff>=0.9.0",
]
test = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--cov=bedrock_pack_manager --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
branch = true
source = ["bedrock_pack_manager"]

[tool.coverage.report]
skip_covered = false
show_missing = true

[tool.ruff]
target-version = "py310"
line-length = 180
src = ["bedrock_pack_manager", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.setuptools]
packages = ["bedrock_pack_manager"]
