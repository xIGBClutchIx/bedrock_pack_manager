name: build-artifacts

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  single-executable:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: bedrock-pack-manager-linux
            artifact_path: dist/bedrock-pack-manager
          - os: windows-latest
            artifact_name: bedrock-pack-manager-windows
            artifact_path: dist/bedrock-pack-manager.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build single executable
        run: npm run build:sea

      - name: Smoke-test the executable
        shell: bash
        run: |
          ./${{ matrix.artifact_path }} --help

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
