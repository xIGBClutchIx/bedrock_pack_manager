name: build-artifacts

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  package-onefile-binaries:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: bedrock-pack-manager-linux
            artifact_path: dist/bedrock-pack-manager
          - os: windows-latest
            artifact_name: bedrock-pack-manager-windows
            artifact_path: dist/bedrock-pack-manager.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build Linux executable
        if: matrix.os == 'ubuntu-latest'
        run: bash scripts/build_linux.sh

      - name: Build Windows executable
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./scripts/build_windows.ps1

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
